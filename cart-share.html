<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order - NinaJewelryUSA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pink:#ff85b3;--pink-light:#ffcce0;--pink-dark:#e84393;--pink-soft:#fff0f6;--text:#5c2d4a;--text-light:#c48aaa;--border:#f5dde8;--bg:#fff5f9;--rose:#ffd6e7}
body{font-family:'Quicksand',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-weight:400}
.header{background:linear-gradient(160deg,#ffe0ec,#ffd6e7,#ffcce0);padding:2.5rem 2rem;text-align:center}
.header::after{content:'🎀 🍋 🦋';display:block;font-size:.9rem;opacity:.4;margin-top:.3rem}
.header h1{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:500;color:var(--text)}
.header h1 span{color:var(--pink-dark)}
.header p{color:var(--text-light);font-size:.9rem;margin-top:.3rem}
.container{max-width:600px;margin:0 auto;padding:2rem 1.5rem}
.order-item{display:flex;align-items:center;gap:1rem;padding:1rem;margin-bottom:.75rem;background:#fff;border-radius:14px;border:2px solid var(--rose)}
.order-num{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--pink);font-weight:500;min-width:28px}
.order-img{width:65px;height:65px;object-fit:cover;border-radius:10px;flex-shrink:0;border:2px solid var(--rose)}
.order-info{flex:1}
.order-title{font-size:.85rem;font-weight:600}
.order-qty{font-size:.75rem;color:var(--text-light);margin-top:.2rem}
.summary{background:linear-gradient(135deg,#5c2d4a,#7a3d6a);color:#fff;border-radius:16px;padding:2rem;text-align:center;margin-top:2rem}
.summary h2{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:400;margin-bottom:.5rem;color:var(--pink-light)}
.summary p{font-size:.85rem;opacity:.6}
.wa-order{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--pink),#ff6b9d);color:#fff;padding:.75rem 2.5rem;border-radius:50px;font-size:.8rem;font-weight:600;margin-top:1.5rem;text-decoration:none;transition:all .3s}
.wa-order:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(255,133,179,.4)}
.back{display:inline-block;margin-top:1rem;color:var(--pink-light);font-size:.8rem;text-decoration:none}
.empty{text-align:center;padding:4rem 2rem;color:var(--text-light);font-size:.95rem}
.empty a{color:var(--pink);text-decoration:none}
.loading{text-align:center;padding:4rem 2rem;color:var(--text-light)}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--rose);border-top-color:var(--pink);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:1rem}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.order-img{width:52px;height:52px}.order-title{font-size:.8rem}}
</style>
</head>
<body>
<div class="header">
<h1>Nina<span>Jewelry</span>USA</h1>
<p>✨ Order Summary</p>
</div>
<div class="container" id="content">
<div class="loading"><div class="spinner"></div><br>Loading order...</div>
</div>
<script>
function render(items){var h='';var pfx='https://xcimg.szwego.com/';var sfx='?imageMogr2/auto-orient/thumbnail/!320x320r/quality/100/format/jpg';var totalQty=items.reduce(function(s,x){return s+(x.q||1)},0);items.forEach(function(item,i){var title=item.t||'Product';var thumb=item.p||'';if(thumb&&thumb.indexOf('http')!==0)thumb=pfx+thumb+sfx;var q=item.q||1;h+='<div class="order-item">';h+='<div class="order-num">#'+(i+1)+'</div>';if(thumb)h+='<img class="order-img" src="'+thumb+'" alt="">';h+='<div class="order-info"><div class="order-title">'+title+'</div>';if(q>1)h+='<div class="order-qty">Qty: '+q+'</div>';h+='</div></div>'});h+='<div class="summary"><h2>\uD83C\uDF80 '+totalQty+' Item'+(totalQty>1?'s':'')+' Selected</h2><p>Contact us to place your order</p><a href="https://wa.me/8613928692115" class="wa-order" target="_blank">\uD83D\uDCAC Chat on WhatsApp</a><br><a href="index.html" class="back">Continue Shopping \u2192</a></div>';document.getElementById('content').innerHTML=h}
function showError(m){document.getElementById('content').innerHTML='<div class="empty">'+m+'<br><br><a href="index.html">\u2190 Go to Shop</a></div>'}
var params=new URLSearchParams(window.location.search);var id=params.get('id');var dParam=params.get('d');var hash=window.location.hash.substring(1);
if(id){fetch('https://raw.githubusercontent.com/linaisgod070-png/nina-jewelry/main/orders/'+id+'.json').then(function(r){if(!r.ok)throw 'err';return r.json()}).then(render).catch(function(){showError('Order not found. Please try again in a moment.')})}
else if(dParam||hash){try{var b64=(dParam||hash).replace(/-/g,'+').replace(/_/g,'/');while(b64.length%4)b64+='=';var json=decodeURIComponent(escape(atob(b64)));var items=JSON.parse(json);if(!items||!items.length)throw 'empty';render(items)}catch(e){showError('Cart is empty or link is invalid.')}}
else{showError('No order data found.')}
</script>
</body>
</html>
