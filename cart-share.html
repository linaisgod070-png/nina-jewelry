<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order - NinaJewelryUSA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#0a0a0a;--gold:#b8977e;--gold-light:#d4b9a0;--bg:#faf8f5;--border:#e8e2dc;--text:#1a1a1a;--text-light:#8a8a8a}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-weight:300;-webkit-font-smoothing:antialiased}
.header{background:var(--primary);padding:3rem 2rem;text-align:center;color:#fff;position:relative}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-light),transparent)}
.header h1{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:400;letter-spacing:3px}
.header h1 span{color:var(--gold-light)}
.header p{font-family:'Cormorant Garamond',serif;opacity:.6;font-size:1rem;margin-top:.5rem;letter-spacing:2px;font-weight:300}
.container{max-width:600px;margin:0 auto;padding:2rem 1.5rem}
.order-item{display:flex;align-items:center;gap:1rem;padding:1.2rem 0;border-bottom:1px solid var(--border)}
.order-item:last-of-type{border-bottom:none}
.order-num{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--gold);font-weight:500;min-width:32px}
.order-info{flex:1}
.order-title{font-size:.9rem;font-weight:400;letter-spacing:.3px}
.order-qty{font-size:.75rem;color:var(--text-light);margin-top:.2rem}
.summary{background:var(--primary);color:#fff;border-radius:8px;padding:2rem;text-align:center;margin-top:2rem}
.summary h2{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:400;margin-bottom:.5rem;color:var(--gold-light);letter-spacing:2px}
.summary p{font-size:.85rem;opacity:.6;font-family:'Cormorant Garamond',serif;letter-spacing:1px}
.wa-order{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:#fff;padding:.75rem 2.5rem;border-radius:50px;font-size:.8rem;font-weight:500;margin-top:1.5rem;text-decoration:none;transition:all .3s;letter-spacing:1px;text-transform:uppercase;font-family:'Inter',sans-serif}
.wa-order:hover{background:var(--gold-light);transform:translateY(-2px)}
.back{display:inline-block;margin-top:1.2rem;color:var(--gold);font-size:.8rem;text-decoration:none;letter-spacing:1px}
.back:hover{text-decoration:underline}
.empty{text-align:center;padding:4rem 2rem;color:var(--text-light);font-family:'Cormorant Garamond',serif;font-size:1.1rem;letter-spacing:1px}
.empty a{color:var(--gold);text-decoration:none}
.empty a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="header">
<h1>Nina<span>Jewelry</span>USA</h1>
<p>Order Summary</p>
</div>
<div class="container" id="content">
<div class="empty">Loading...</div>
</div>
<script>
try{
var hash=window.location.hash.substring(1);
if(!hash)throw 'no data';
var b64=hash.replace(/-/g,'+').replace(/_/g,'/');
while(b64.length%4)b64+='=';
var json=decodeURIComponent(escape(atob(b64)));
var items=JSON.parse(json);
if(!items||!items.length)throw 'empty';
var h='';
var totalQty=items.reduce(function(s,x){return s+(x.q||x.qty||1)},0);
items.forEach(function(item,i){
var title=item.t||item.title||'Product';
var q=item.q||item.qty||1;
h+='<div class="order-item">';
h+='<div class="order-num">'+(i+1)+'</div>';
h+='<div class="order-info">';
h+='<div class="order-title">'+title+'</div>';
if(q>1)h+='<div class="order-qty">Qty: '+q+'</div>';
h+='</div></div>';
});
h+='<div class="summary">';
h+='<h2>'+totalQty+' Item'+(totalQty>1?'s':'')+' Selected</h2>';
h+='<p>Contact us to place your order</p>';
h+='<a href="https://wa.me/8613928692115" class="wa-order" target="_blank">Chat on WhatsApp</a>';
h+='<br><a href="index.html" class="back">Continue Shopping →</a>';
h+='</div>';
document.getElementById('content').innerHTML=h;
}catch(e){
document.getElementById('content').innerHTML='<div class="empty">Cart is empty or link is invalid.<br><br><small style="color:#ccc;word-break:break-all">Debug: hash='+hash.substring(0,50)+'... err='+e+'</small><br><br><a href="index.html">← Go to Shop</a></div>';
}
</script>
</body>
</html>
